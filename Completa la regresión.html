<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Completa la regresión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{--bg:#eef2f6;--grid:#dbe3ec;--ink:#14213d;--mute:#5b6b82;--card:#fff;--line:#c4d0de;--ok:#12805c;--okbg:#dff5ec;--bad:#b3261e;--badbg:#fde4e1;--acc:#2447d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--grid:#18233a;--ink:#e8eefb;--mute:#93a4c0;--card:#172036;--line:#2c3b59;--ok:#5fd6a7;--okbg:#12382c;--bad:#ff8f86;--badbg:#44201d;--acc:#8aa5ff}}
:root[data-theme="dark"]{--bg:#0f1624;--grid:#18233a;--ink:#e8eefb;--mute:#93a4c0;--card:#172036;--line:#2c3b59;--ok:#5fd6a7;--okbg:#12382c;--bad:#ff8f86;--badbg:#44201d;--acc:#8aa5ff}
*{box-sizing:border-box}
@keyframes drift{to{background-position:28px 28px,28px 28px}}
@keyframes float{to{background-position:0 -280px,70px -350px}}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.3;background-image:radial-gradient(circle,var(--acc) 3px,transparent 4px),radial-gradient(circle,var(--ink) 2px,transparent 3px);background-size:140px 140px,210px 210px;background-position:0 0,70px 70px;animation:float 40s linear infinite}
@media (prefers-reduced-motion:reduce){body,body::before{animation:none}}
body{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;animation:drift 14s linear infinite;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:20px 14px 48px}
h1{font:800 clamp(28px,6vw,44px)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:8px 0 4px}
h2{font:600 19px "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 8px}
p{margin:0 0 8px;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
button{font:inherit;cursor:pointer;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 13px}
button:hover{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.on{background:var(--ink);color:var(--bg)}
button.main{background:var(--acc);border-color:var(--acc);color:#fff}
.score{margin-left:auto;font-weight:700}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px;margin:14px 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px;text-align:center}
th,td{border:1px solid var(--line);padding:4px}
th{font-weight:600;font-size:14px;background:var(--bg)}
td.g{background:var(--bg);font-weight:600}
input{width:100%;min-width:64px;font:inherit;text-align:center;border:1.5px solid var(--line);border-radius:6px;padding:5px 3px;background:var(--card);color:var(--ink)}
input.ok{border-color:var(--ok);background:var(--okbg)}
input.bad{border-color:var(--bad);background:var(--badbg)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.row label{flex:1 1 150px;font-size:14px;color:var(--mute)}
.row label b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.msg{min-height:24px;font-weight:600}
.hint{font-size:14px;color:var(--mute)}
svg{width:100%;height:auto;max-height:300px}
</style>
</head>
<body>
<main>
<h1>Completa la regresión</h1>
<p>Rellena la tabla y calcula la recta ŷ = b₀ + b₁·x. Redondea a 2 decimales. Ganas 10 puntos por cada casilla que aciertes la primera vez.</p>

<div class="bar" id="levels">
  <button data-n="4">Fácil · 4 datos</button>
  <button data-n="5" class="on">Medio · 5 datos</button>
  <button data-n="6">Difícil · 6 datos</button>
  <span class="score">Puntos: <span id="score">0</span></span>
</div>

<div class="card">
  <h2>Tabla</h2>
  <div class="scroll"><table id="tbl"></table></div>
  <p class="hint">Fila Σ: escribe la suma de cada columna.</p>
</div>

<div class="card">
  <h2>Resultados</h2>
  <div class="row">
    <label><b>b₁ =</b><input id="b1" inputmode="decimal" autocomplete="off"></label>
    <label><b>b₀ =</b><input id="b0" inputmode="decimal" autocomplete="off"></label>
  </div>
  <div class="row" style="margin-top:10px">
    <label><b>r =</b><input id="r" inputmode="decimal" autocomplete="off"></label>
  </div>
</div>

<div class="bar">
  <button class="main" id="check">Comprobar</button>
  <button id="hint">Pista</button>
  <button id="reveal">Ver respuestas</button>
  <button id="again">Nuevo problema</button>
</div>
<div class="msg" id="msg" role="status"></div>
<div class="card" id="plot" hidden><h2>Tu recta</h2><div id="svgbox"></div></div>
</main>

<script>
(function(){
var n=5,D=null,score=0,hintI=0;
var $=function(i){return document.getElementById(i)};
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function r2(v){return Math.round(v*100)/100}
function gen(){
  var xs=[];while(xs.length<n){var v=rnd(1,12);if(xs.indexOf(v)<0)xs.push(v)}
  xs.sort(function(a,b){return a-b});
  var b=(Math.random()<0.7?1:-1)*(0.6+Math.random()*2.2),a=rnd(4,20),ys=xs.map(function(x){return Math.max(1,Math.round(a+b*x+(Math.random()-0.5)*5))});
  var s=0;xs.forEach(function(x){s+=x});var xb0=s/n;
  var sxx=0;xs.forEach(function(x){sxx+=(x-xb0)*(x-xb0)});
  var syy0=0,my=0;ys.forEach(function(y){my+=y});my/=n;ys.forEach(function(y){syy0+=(y-my)*(y-my)});
  if(sxx===0||syy0===0)return gen();
  return {x:xs,y:ys};
}
function solve(){
  var x=D.x,y=D.y,i,sx=0,sy=0,sx2=0,sy2=0,sxy=0,x2=[],y2=[],xy=[];
  for(i=0;i<n;i++){x2.push(x[i]*x[i]);y2.push(y[i]*y[i]);xy.push(x[i]*y[i]);sx+=x[i];sy+=y[i];sx2+=x2[i];sy2+=y2[i];sxy+=xy[i]}
  var b1=(n*sxy-sx*sy)/(n*sx2-sx*sx),b0=(sy-b1*sx)/n,r=(n*sxy-sx*sy)/Math.sqrt((n*sx2-sx*sx)*(n*sy2-sy*sy));
  D.s={x2:x2,y2:y2,xy:xy,sx:sx,sy:sy,sx2:sx2,sy2:sy2,sxy:sxy,b1:b1,b0:b0,r:r};
}
function build(){
  var s=D.s,h='<tr><th>x</th><th>y</th><th>x²</th><th>y²</th><th>xy</th></tr>',i;
  for(i=0;i<n;i++)h+='<tr><td class="g">'+D.x[i]+'</td><td class="g">'+D.y[i]+'</td><td>'+cell('x2'+i,s.x2[i],0.02)+'</td><td>'+cell('y2'+i,s.y2[i],0.02)+'</td><td>'+cell('xy'+i,s.xy[i],0.02)+'</td></tr>';
  var sc=function(id,a,ph){return cell(id,a,0.02).replace('<input','<input placeholder="'+ph+'"')};
  h+='<tr><td>'+sc('sx',s.sx,'Σx')+'</td><td>'+sc('sy',s.sy,'Σy')+'</td><td>'+sc('sx2',s.sx2,'Σx²')+'</td><td>'+sc('sy2',s.sy2,'Σy²')+'</td><td>'+sc('sxy',s.sxy,'Σxy')+'</td></tr>';
  $('tbl').innerHTML=h;
  var set=function(id,a,t){var e=$(id);e.dataset.a=a;e.dataset.t=t};
  set('b1',s.b1,0.03);set('b0',s.b0,0.15);set('r',s.r,0.02);
}
function solveOld(){
  var x=D.x,y=D.y,xb=0,yb=0,i;
  for(i=0;i<n;i++){xb+=x[i];yb+=y[i]}xb/=n;yb/=n;
  var dx=[],dy=[],dx2=[],dy2=[],dxy=[],sxx=0,syy=0,sxy=0;
  for(i=0;i<n;i++){dx.push(r2(x[i]-xb));dy.push(r2(y[i]-yb));
    var a=x[i]-xb,b=y[i]-yb;dx2.push(r2(a*a));dy2.push(r2(b*b));dxy.push(r2(a*b));sxx+=a*a;syy+=b*b;sxy+=a*b}
  var b1=sxy/sxx,b0=yb-b1*xb,r=sxy/Math.sqrt(sxx*syy);
  var x0;do{x0=rnd(1,13)}while(x.indexOf(x0)>=0);
  D.s={xb:xb,yb:yb,dx:dx,dy:dy,dx2:dx2,dy2:dy2,dxy:dxy,sxx:sxx,syy:syy,sxy:sxy,b1:b1,b0:b0,r:r,x0:x0};
}
function cell(id,ans,tol){return '<input id="'+id+'" data-a="'+ans+'" data-t="'+tol+'" inputmode="decimal" autocomplete="off" aria-label="'+id+'">'}
function buildOld(){
  var s=D.s,h='<tr><th>x</th><th>y</th><th>x−x̄</th><th>y−ȳ</th><th>(x−x̄)²</th><th>(y−ȳ)²</th><th>(x−x̄)(y−ȳ)</th></tr>';
  for(var i=0;i<n;i++){
    h+='<tr><td class="g">'+D.x[i]+'</td><td class="g">'+D.y[i]+'</td><td>'+cell('dx'+i,s.dx[i],0.02)+'</td><td>'+cell('dy'+i,s.dy[i],0.02)+'</td><td>'+cell('dx2'+i,s.dx2[i],0.02)+'</td><td>'+cell('dy2'+i,s.dy2[i],0.02)+'</td><td>'+cell('dxy'+i,s.dxy[i],0.02)+'</td></tr>';
  }
  h+='<tr><td class="g">Σ</td><td class="g">Σ</td><td class="g">≈ 0</td><td class="g">≈ 0</td><td>'+cell('sxx',s.sxx,0.1)+'</td><td>'+cell('syy',s.syy,0.1)+'</td><td>'+cell('sxy',s.sxy,0.1)+'</td></tr>';
  $('tbl').innerHTML=h;
  var set=function(id,a,t){var e=$(id);e.dataset.a=a;e.dataset.t=t};
  set('b1',s.b1,0.03);set('b0',s.b0,0.15);set('r',s.r,0.02);
}
function inputs(){return Array.prototype.slice.call(document.querySelectorAll('input'))}
function reset(){
  D=gen();solve();build();hintI=0;$('msg').textContent='';$('plot').hidden=true;
  inputs().forEach(function(e){e.value='';e.className='';e.dataset.done=''});
}
function parse(v){return parseFloat(String(v).replace(',','.'))}
function check(){
  var ok=0,tot=0,gain=0;
  inputs().forEach(function(e){
    if(!e.dataset.a)return;tot++;
    var v=parse(e.value);
    if(e.value.trim()===''||isNaN(v)){e.className='';return}
    if(Math.abs(v-parseFloat(e.dataset.a))<=parseFloat(e.dataset.t)){
      e.className='ok';ok++;
      if(!e.dataset.done){e.dataset.done='1';if(!e.dataset.rev)gain+=10}
    }else e.className='bad';
  });
  score+=gain;$('score').textContent=score;
  if(ok===tot){$('msg').textContent='¡Perfecto! Completaste las '+tot+' casillas. Suma +'+gain+' esta ronda.';draw()}
  else $('msg').textContent=ok+' de '+tot+' correctas. Las rojas tienen error; las vacías faltan.';
}
function reveal(){
  inputs().forEach(function(e){if(e.dataset.a&&e.className!=='ok'){e.dataset.rev='1';e.value=r2(parseFloat(e.dataset.a));e.className='ok';e.dataset.done='1'}});
  $('msg').textContent='Respuestas reveladas (sin puntos para esas casillas).';draw();
}
var hints=['Rellena x², y² y xy en cada fila. Después suma cada columna.','En la fila Σ escribe Σx, Σy, Σx², Σy² y Σxy (n es el número de datos).','b₁ = (n·Σxy − Σx·Σy) / (n·Σx² − (Σx)²)','b₀ = (Σy − b₁·Σx) / n','r = (n·Σxy − Σx·Σy) / √[(n·Σx² − (Σx)²)(n·Σy² − (Σy)²)]'];var hintsOld=['Calcula x̄ sumando todos los x y dividiendo entre n. Lo mismo para ȳ.','Resta el promedio a cada valor: x−x̄ y y−ȳ. Luego eleva al cuadrado o multiplica.','En la fila Σ suma cada columna de abajo hacia arriba. Úsala para b₁ = Σxy / Σxx.','b₀ = ȳ − b₁·x̄. Para r usa Σxy / √(Σxx · Σyy).'];
function hint(){$('msg').textContent='Pista: '+hints[hintI%hints.length];hintI++}
function draw(){
  var s=D.s,W=560,H=300,m=38,xmax=14,ymin=Math.min.apply(null,D.y),ymax=Math.max.apply(null,D.y),pad=(ymax-ymin)*0.2+1;
  ymin=Math.floor(ymin-pad);ymax=Math.ceil(ymax+pad);
  var X=function(v){return m+v/xmax*(W-m-12)},Y=function(v){return H-m-(v-ymin)/(ymax-ymin)*(H-m-12)};
  var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Diagrama de dispersión con la recta de regresión">';
  g+='<line x1="'+m+'" y1="'+(H-m)+'" x2="'+(W-8)+'" y2="'+(H-m)+'" stroke="var(--mute)"/><line x1="'+m+'" y1="10" x2="'+m+'" y2="'+(H-m)+'" stroke="var(--mute)"/>';
  g+='<line x1="'+X(0)+'" y1="'+Y(s.b0)+'" x2="'+X(xmax)+'" y2="'+Y(s.b0+s.b1*xmax)+'" stroke="var(--acc)" stroke-width="2.5"/>';
  for(var i=0;i<n;i++)g+='<circle cx="'+X(D.x[i])+'" cy="'+Y(D.y[i])+'" r="5.5" fill="var(--ink)"/>';
  g+='<text x="'+(W/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="13" fill="var(--mute)">x</text><text x="14" y="'+(H/2)+'" font-size="13" fill="var(--mute)">y</text></svg>';
  g+='<p>ŷ = '+r2(s.b0)+(s.b1<0?' − ':' + ')+Math.abs(r2(s.b1))+'·x · R² = '+r2(s.r*s.r)+'</p>';
  $('svgbox').innerHTML=g;$('plot').hidden=false;
}
$('check').onclick=check;$('reveal').onclick=reveal;$('hint').onclick=hint;$('again').onclick=reset;
document.querySelectorAll('#levels button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('#levels button').forEach(function(o){o.classList.remove('on')});
  b.classList.add('on');n=parseInt(b.dataset.n,10);reset();
}});
reset();
})();
</script>
</body>
</html>
